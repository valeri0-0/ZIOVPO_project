version: '3.9'

services:

  minio:
    image: minio/minio
    container_name: ziovpo-minio

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: rootadmin
      MINIO_ROOT_PASSWORD: rootpassword

    command: server /data --console-address ":9001"

    volumes:
      - minio_data:/data

volumes:
  minio_data: